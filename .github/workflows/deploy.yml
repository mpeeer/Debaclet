name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Copy built files to repo root
        run: |
          rm -rf docs
          rm -f .nojekyll 404.html
          rm -rf assets
          cp -r client/dist/* .
          touch .nojekyll
          cp index.html 404.html

      - name: Commit and push to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: Deploy to GitHub Pages
          file_pattern: '.nojekyll 404.html index.html assets/'
          skip_fetch: true
          skip_checkout: true
